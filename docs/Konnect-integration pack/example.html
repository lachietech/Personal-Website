<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Konnect contact example</title></head>
<body>
  <h1>Contact us</h1>
  <form id="contact-form">
    <p><label>Name <input name="name" required maxlength="120" autocomplete="name"></label></p>
    <p><label>Email <input name="email" type="email" required maxlength="254" autocomplete="email"></label></p>
    <p><label>Subject <input name="subject" required maxlength="160"></label></p>
    <p><label>Message <textarea name="message" required maxlength="4000"></textarea></label></p>
    <div hidden aria-hidden="true"><label>Leave empty <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button type="submit">Send enquiry</button>
    <p id="contact-status" role="status" aria-live="polite"></p>
  </form>
  <script type="module" src="./example.js"></script>
</body>
</html>
